name: Publier Totus Tuus sur GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: totus-tuus-pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Construire la version candidate depuis le site actuel
        run: python3 scripts/import_public_site.py
      - name: Vérifier les fichiers et la syntaxe JavaScript
        run: |
          python3 scripts/check_site.py site
          for file in site/*.js; do node --check "$file"; done
      - name: Activer GitHub Pages avec GitHub Actions si autorisé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || echo "Configuration Pages existante ou activation à effectuer dans Settings > Pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
