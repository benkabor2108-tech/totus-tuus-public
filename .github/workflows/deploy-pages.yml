name: Publier Totus Tuus sur GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: totus-tuus-pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer la sauvegarde publique V5.11.4 validée
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 39743669660
          github-token: ${{ github.token }}
          path: /tmp/totus-backup
      - name: Restaurer les fichiers complets puis appliquer les corrections
        run: |
          set -euo pipefail
          mkdir -p site
          ls -lah /tmp/totus-backup
          find /tmp/totus-backup -maxdepth 2 -type f -print
          tar -xf /tmp/totus-backup/artifact.tar -C site
          test -s site/app.js
          test -s site/navigation.js
          test -s site/guided.js
          test -s site/comfort.js
          test -s site/reading-comfort.js
          test -s site/modules/parcours-marial/parcours-marial.js
          git clone --quiet --depth 1 --branch candidate/parcours-marial-33-jours "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/totus-marial-src
          cd /tmp/totus-marial-src
          python3 scripts/build_bible_crampon_33.py
          mkdir -p "$GITHUB_WORKSPACE/site/modules/parcours-marial"
          cp modules/parcours-marial/*.js modules/parcours-marial/*.json modules/parcours-marial/*.jpg "$GITHUB_WORKSPACE/site/modules/parcours-marial/"
          python3 scripts/build_traite_33_lectures.py "$GITHUB_WORKSPACE/site/modules/parcours-marial/traite_33_lectures.json"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site')
          js=p/'modules/parcours-marial/parcours-marial.js'
          src=js.read_text(encoding='utf-8')
          assert "totus-tuus-parcours-marial-33-v2" in src
          assert "Par l’intercession de la Très Sainte Vierge Marie" in src
          presentation=p/'presentation.js'
          presentation.write_text(Path('overrides/presentation.js').read_text(encoding='utf-8'),encoding='utf-8')
          assert 'totus-marial-day-list' in presentation.read_text(encoding='utf-8')
          html=p/'index.html'
          content=html.read_text(encoding='utf-8')
          content=re.sub(r'<script[^>]*src=[^>]*presentation\\.js[^>]*>\\s*</script>', '', content, flags=re.I)
          content=re.sub(r'<script[^>]*src=[^>]*parcours-marial\.js[^>]*>\s*</script>', '', content, flags=re.I)
          content=content.replace('</body>','<script src="./presentation.js?v=5.11.9" defer></script><script src="./modules/parcours-marial/parcours-marial.js?v=5.11.9" defer></script></body>',1)
          html.write_text(content,encoding='utf-8')
          sw=p/'service-worker.js'
          worker=sw.read_text(encoding='utf-8')
          worker,n=re.subn(r"const CACHE=[^;\\n]+", "const CACHE='totus-tuus-pages-v5-11-9'", worker, count=1)
          assert n==1
          worker=worker.replace('v=5.11.4','v=5.11.9')
          sw.write_text(worker,encoding='utf-8')
          print('Restauré depuis V5.11.4, livre V5.11.9 ajouté.')
          PY
          python3 /tmp/totus-marial-src/scripts/check_site.py site
          for file in site/*.js site/modules/parcours-marial/*.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          site=Path('site')
          html=(site/'index.html').read_text()
          missing=[]
          for url in re.findall(r'<script[^>]*src="([^"]+)"',html,re.I):
              path=url.split('?')[0].lstrip('./')
              if not (site/path).is_file(): missing.append(path)
          assert not missing, f'Scripts HTML absents: {missing}'
          assert (site/'presentation.js').stat().st_size>1000
          assert (site/'app.js').stat().st_size>1000
          assert (site/'navigation.js').stat().st_size>1000
          assert (site/'guided.js').stat().st_size>1000
          assert (site/'comfort.js').stat().st_size>1000
          assert (site/'reading-comfort.js').stat().st_size>1000
          print('Tous les scripts référencés sont présents.')
          PY
      - name: Vérifier la version restaurée
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('site')
          js=(p/'modules/parcours-marial/parcours-marial.js').read_text()
          assert 'totus-tuus-parcours-marial-33-v2' in js
          assert 'totus-tuus-pages-v5-11-9' in (p/'service-worker.js').read_text()
          assert len(json.loads((p/'modules/parcours-marial/parcours_marial_33_jours_enrichi.json').read_text())['jours'])==33
          assert 'Découvrir les thèmes des 33 journées' in (p/'presentation.js').read_text()
          (p/'version.json').write_text(json.dumps({'version':'5.11.9-pages','release':'5.11.9'},ensure_ascii=False),encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
