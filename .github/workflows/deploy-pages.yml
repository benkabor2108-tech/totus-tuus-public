name: Publier Totus Tuus sur GitHub Pages
# Rétablissement du bouton de partage V5.11.14
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: totus-tuus-pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le livrable autonome validé par Chromium
        uses: actions/download-artifact@v4
        with:
          name: totus-tuus-v5-11-0-rc-non-publie
          run-id: 39838321966
          github-token: ${{ github.token }}
          path: /tmp/totus-backup
      - name: Restaurer les fichiers complets puis appliquer les corrections
        run: |
          set -euo pipefail
          mkdir -p site
          ls -lah /tmp/totus-backup
          find /tmp/totus-backup -maxdepth 2 -type f -print
          cp -a /tmp/totus-backup/. site/
          test -s site/app.js
          test -s site/navigation.js
          test -s site/guided.js
          test -s site/comfort.js
          test -s site/reading-comfort.js
          test -s site/modules/parcours-marial/parcours-marial.js
          git clone --quiet --depth 1 --branch candidate/parcours-marial-33-jours "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/totus-marial-src
          cd /tmp/totus-marial-src
          python3 scripts/build_bible_crampon_33.py
          mkdir -p "$GITHUB_WORKSPACE/site/modules/parcours-marial"
          cp modules/parcours-marial/*.js modules/parcours-marial/*.json modules/parcours-marial/*.jpg "$GITHUB_WORKSPACE/site/modules/parcours-marial/"
          python3 scripts/build_traite_33_lectures.py "$GITHUB_WORKSPACE/site/modules/parcours-marial/traite_33_lectures.json"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site')
          js=p/'modules/parcours-marial/parcours-marial.js'
          src=js.read_text(encoding='utf-8')
          assert "totus-tuus-parcours-marial-33-v2" in src
          assert "Par l’intercession de la Très Sainte Vierge Marie" in src
          presentation=p/'presentation.js'
          presentation.write_text(Path('overrides/presentation.js').read_text(encoding='utf-8'),encoding='utf-8')
          (p/'update-manager.js').write_text(Path('overrides/update-manager.js').read_text(encoding='utf-8'),encoding='utf-8')
          (p/'share-app.js').write_text(Path('overrides/share-app.js').read_text(encoding='utf-8'),encoding='utf-8')
          assert 'totus-marial-day-list' in presentation.read_text(encoding='utf-8')
          html=p/'index.html'
          content=html.read_text(encoding='utf-8')
          content=re.sub(r'<script[^>]*src=[^>]*presentation\.js[^>]*>\s*</script>', '', content, flags=re.I)
          content=re.sub(r'<script[^>]*src=[^>]*parcours-marial\.js[^>]*>\s*</script>', '', content, flags=re.I)
          content=content.replace('</body>','<script src="./update-manager.js?v=5.11.14" defer></script><script src="./presentation.js?v=5.11.14" defer></script><script src="./share-app.js?v=5.11.14" defer></script><script src="./modules/parcours-marial/parcours-marial.js?v=5.11.14" defer></script></body>',1)
          html.write_text(content,encoding='utf-8')
          sw=p/'service-worker.js'
          worker=sw.read_text(encoding='utf-8')
          worker,n=re.subn(r"const CACHE=[^;\\n]+", "const CACHE='totus-tuus-pages-v5-11-14'", worker, count=1)
          assert n==1
          worker=worker.replace('v=5.11.4','v=5.11.14')
          # Activer la nouvelle version dès son installation, sans effacer le stockage local.
          worker += "\nself.addEventListener('install', () => self.skipWaiting());\nself.addEventListener('activate', event => event.waitUntil(self.clients.claim()));\n"

          sw.write_text(worker,encoding='utf-8')
          print('Restauré depuis le livrable validé, livre V5.11.14 ajouté.')
          PY
          python3 /tmp/totus-marial-src/scripts/check_site.py site
          for file in site/*.js site/modules/parcours-marial/*.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          site=Path('site')
          html=(site/'index.html').read_text()
          missing=[]
          for url in re.findall(r'<script[^>]*src="([^"]+)"',html,re.I):
              path=url.split('?')[0].lstrip('./')
              if not (site/path).is_file(): missing.append(path)
          assert not missing, f'Scripts HTML absents: {missing}'
          assert (site/'update-manager.js').stat().st_size>1000
          assert (site/'presentation.js').stat().st_size>1000
          assert (site/'share-app.js').stat().st_size>500
          assert 'share-app.js?v=5.11.14' in html
          assert 'Partager Totus Tuus' in (site/'share-app.js').read_text()
          assert "discover.insertAdjacentElement('afterend', button)" in (site/'share-app.js').read_text()
          assert (site/'app.js').stat().st_size>1000
          assert (site/'navigation.js').stat().st_size>1000
          assert (site/'guided.js').stat().st_size>1000
          assert (site/'comfort.js').stat().st_size>1000
          assert (site/'reading-comfort.js').stat().st_size>1000
          print('Tous les scripts référencés sont présents.')
          PY
      - name: Vérifier la version restaurée
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('site')
          js=(p/'modules/parcours-marial/parcours-marial.js').read_text()
          assert 'totus-tuus-parcours-marial-33-v2' in js
          assert 'totus-tuus-pages-v5-11-14' in (p/'service-worker.js').read_text()
          assert len(json.loads((p/'modules/parcours-marial/parcours_marial_33_jours_enrichi.json').read_text())['jours'])==33
          assert 'totus-update-notice' in (p/'update-manager.js').read_text()
          assert 'Découvrir les thèmes des 33 journées' in (p/'presentation.js').read_text()
          (p/'version.json').write_text(json.dumps({'version':'5.11.14-pages','release':'5.11.14'},ensure_ascii=False),encoding='utf-8')
          PY
      - name: Préparer le mode hors connexion complet et vérifier les ressources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          site=Path('site')
          files=sorted(p.relative_to(site).as_posix() for p in site.rglob('*') if p.is_file() and not p.name.startswith('.'))
          required=[
            'index.html','app.js','navigation.js','guided.js','comfort.js',
            'reading-comfort.js','presentation.js','update-manager.js','share-app.js',
            'modules/parcours-marial/parcours-marial.js',
            'modules/parcours-marial/parcours_marial_33_jours_enrichi.json',
            'modules/parcours-marial/bible_crampon_33_lectures.json',
            'modules/parcours-marial/traite_33_lectures.json'
          ]
          required += [f for f in files if f.startswith('modules/parcours-marial/') and f.lower().endswith(('.jpg','.png','.webp'))]
          missing=sorted(set(required)-set(files))
          assert not missing, f'Ressources essentielles hors connexion absentes: {missing}'
          assert len(required)>=14, 'Couverture du livre absente'
          source=Path('overrides/offline-service-worker.js').read_text(encoding='utf-8')
          assert source.count('__CACHE_NAME__')==1
          assert source.count('__PRECACHE_FILES__')==1
          assert source.count('__REQUIRED_FILES__')==1
          worker=source.replace('__CACHE_NAME__','totus-tuus-pages-v5-11-14').replace('__PRECACHE_FILES__',json.dumps(files,ensure_ascii=False)).replace('__REQUIRED_FILES__',json.dumps(required,ensure_ascii=False))
          (site/'service-worker.js').write_text(worker,encoding='utf-8')
          assert 'totus-tuus-parcours-marial-33-v2' in (site/'modules/parcours-marial/parcours-marial.js').read_text(encoding='utf-8')
          print(f'Mode hors connexion V5.11.14: {len(files)} fichiers prévus, {len(required)} obligatoires, aucune donnée locale effacée.')
          PY
          node --check site/service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          sw=Path('site/service-worker.js').read_text()
          assert 'modules/parcours-marial/bible_crampon_33_lectures.json' in sw
          assert 'modules/parcours-marial/traite_33_lectures.json' in sw
          assert "req.mode==='navigate'" in sw
          assert "await c.addAll(REQUIRED.map(absolute))" in sw
          PY
      - name: Tester réellement le livre sans connexion dans Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
          (cd site && python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/totus-offline-http.log 2>&1) &
          sleep 3
          node scripts/test_offline_marial.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
