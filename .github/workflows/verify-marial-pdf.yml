name: Verifier le PDF marial (candidat uniquement)
on:
  push:
    branches: [candidate/parcours-marial-33]
    paths: ['.github/workflows/verify-marial-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer le texte PDF depuis Wikisource
        shell: bash
        run: |
          mkdir -p /tmp/marial
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from pathlib import Path
          urls=[
            "https://laportelatine.org/wp-content/uploads/2020/07/traite_vraie_devotion.pdf"
          ]
          for i,url in enumerate(urls,1):
            try:
              req=Request(url,headers={"User-Agent":"TotusTuusPublic/1.0 (public-domain book preservation; GitHub Actions)"})
              with urlopen(req,timeout=35) as response:
                data=response.read(45*1024*1024+1)
                mime=response.headers.get("Content-Type","")
              print("Source",i,"bytes",len(data),"mime",mime)
              if data.startswith(b"%PDF-") and 100_000 < len(data) < 45*1024*1024:
                Path("/tmp/marial/traite-vraie-devotion-fr.pdf").write_bytes(data)
                Path("/tmp/marial/source.txt").write_text(url+"\n")
                break
            except Exception as exc: print("Source",i,"error",str(exc)[:200])
          else: raise SystemExit("Aucun PDF valide disponible")
          PY
      - name: Installer les outils PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Examiner les metadonnees et les pages
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path('/tmp/marial/traite-vraie-devotion-fr.pdf')
          data=p.read_bytes()
          try:
            import fitz
            doc=fitz.open(stream=data,filetype='pdf')
            pages=len(doc)
            extracted=sum(len(page.get_text()) for page in doc)
            print('pages',pages,'text_chars',extracted)
            assert pages >= 10, 'PDF trop court pour un livre complet'
          except ImportError:
            result=subprocess.run(['pdfinfo',str(p)],capture_output=True,text=True,check=True)
            print(result.stdout)
            pages=int(next(line.split(':',1)[1] for line in result.stdout.splitlines() if line.startswith('Pages:')))
            assert pages>=10
            extracted=None
          txt=subprocess.run(['pdftotext','-layout',str(p),'-'],capture_output=True,text=True,check=True).stdout
          normalized=' '.join(txt.lower().split())
          keywords=['marie','jésus','dévotion','consécration']
          keyword_hits={w:(w in normalized) for w in keywords}
          print('text_characters',len(txt),'keyword_hits',keyword_hits)
          assert len(txt)>25000, 'Texte extrait insuffisant : vérification manuelle nécessaire'
          assert sum(keyword_hits.values())>=3, 'Contenu à vérifier'
          Path('/tmp/marial/extrait-controle.txt').write_text(txt[:25000],encoding='utf-8')
          meta={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'pdf_pages':pages,'text_chars':len(txt),'keyword_hits':keyword_hits,'extracted_text_characters':extracted,'source':Path('/tmp/marial/source.txt').read_text().strip(),'verified_in_github_actions':True,'edition_pagination_verified':False,'android_tests_performed':False}
          Path('/tmp/marial/manifest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,indent=2))
          PY
      - name: Constituer le dossier lecteur + PDF hors ligne
        if: success()
        run: |
          cp parcours-marial/lecteur-candidat.html /tmp/marial/index.html
          cp parcours-marial/TEST_ANDROID.md /tmp/marial/TEST_ANDROID.md
          cp parcours-marial/sw.js /tmp/marial/sw.js
          python3 parcours-marial/build_33_readings.py
          test -s /tmp/marial/traite-vraie-devotion-fr.pdf
          test -s /tmp/marial/manifest.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/marial')
          h=(p/'index.html').read_text()
          assert 'traite-vraie-devotion-fr.pdf' in h
          assert 'totus-marial-33-candidate-v1' in h
          assert 'window.TOTUS_MARIAL_READING?.days?.[n-1]' in h, 'Lectures non connectees au lecteur'
          assert h.count('id="reading"')==1 and h.count('id="meditation"')==1 and h.count('id="prayer"')==1
          assert 'id="larger"' in h and 'id="bottom-next"' in h and '<details>' in h
          assert (p/'parcours-33.js').stat().st_size > 100000
          assert (p/'parcours-33.json').stat().st_size > 100000
          import json
          units=json.loads((p/'parcours-33.json').read_text())['days']
          assert len(units)==33
          assert len({x['meditation'] for x in units})==33
          assert len({x['prayer'] for x in units})==33
          assert len({x['theme'] for x in units})==33
          assert (p/'traite-vraie-devotion-fr.pdf').read_bytes().startswith(b'%PDF-')
          print('Candidat autonome HTML + PDF pret pour essais locaux')
          PY
      - name: Verifier lecture locale et code du lecteur
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path('/tmp/marial')
          h=(p/'index.html').read_text(encoding='utf-8')
          assert h.count('id="day"')==1
          assert 'localStorage.setItem(key' in h
          assert 'totus-marial-33-candidate-v1' in h
          assert (p/'traite-vraie-devotion-fr.pdf').stat().st_size>100000
          js=h.split('<script>',1)[1].split('</script>',1)[0]
          (p/'reader-check.js').write_text(js,encoding='utf-8')
          print('Controle lecteur: 33 jours, stockage isole et PDF local')
          PY
          node --check /tmp/marial/reader-check.js
          node --check /tmp/marial/sw.js
          test -s /tmp/marial/sw.js
          (cd /tmp/marial && python3 -m http.server 8765 >/tmp/marial-http.log 2>&1 &)
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/index.html -o /tmp/marial/index-served.html
          curl --fail --silent --show-error http://127.0.0.1:8765/traite-vraie-devotion-fr.pdf -o /tmp/marial/pdf-served.pdf
          cmp /tmp/marial/traite-vraie-devotion-fr.pdf /tmp/marial/pdf-served.pdf
          curl --fail --silent --show-error http://127.0.0.1:8765/sw.js | grep -q 'totus-marial-preview-'
          rm /tmp/marial/index-served.html /tmp/marial/pdf-served.pdf /tmp/marial/reader-check.js
          echo "Test HTTP local: lecteur et PDF servis sans dépendance externe"
      - name: Publier les fichiers de previsualisation sur la branche candidate seulement
        if: success()
        run: |
          mkdir -p preview-marial
          cp /tmp/marial/index.html /tmp/marial/sw.js /tmp/marial/parcours-33.js /tmp/marial/parcours-33.json /tmp/marial/traite-vraie-devotion-fr.pdf /tmp/marial/TEST_ANDROID.md preview-marial/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-marial/
          if ! git diff --cached --quiet; then
            git commit -m "Build isolated 33-day Marian preview assets"
            git push origin HEAD:candidate/parcours-marial-33
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marial-pdf-source-candidat
          path: /tmp/marial/
          retention-days: 14
          if-no-files-found: error
