name: Publier Totus Tuus sur GitHub Pages
# Release 5.10.0 : 108 prières d'intercession et actes de confiance personnalisés.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: totus-tuus-pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Construire la version candidate depuis le site actuel
        run: python3 scripts/import_public_site.py
      - name: Préparer une prévisualisation isolée des 108 prières
        run: |
          git clone --quiet --depth 1 --branch candidate/intercessions-108 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/totus-preview-src
          cd /tmp/totus-preview-src
          python3 scripts/import_public_site.py
          python3 scripts/check_site.py site
          for file in site/*.js; do node --check "$file"; done
          cd "$GITHUB_WORKSPACE"
          mkdir -p site/preview-intercessions
          cp -a /tmp/totus-preview-src/site/. site/preview-intercessions/
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("site/preview-intercessions")
          js=p/"interventions.js"
          content=js.read_text(encoding="utf-8")
          old="totus-intercession-v51"
          assert old in content
          js.write_text(content.replace(old,"totus-intercession-preview-108"),encoding="utf-8")
          sw=p/"service-worker.js"
          sw.write_text(sw.read_text(encoding="utf-8").replace("totus-tuus-pages-v5-9-1","totus-tuus-intercessions-preview-108"),encoding="utf-8")
          version=p/"version.json"
          version.write_text(json.dumps({"version":"candidate-intercessions-108","release":"preview-only"}),encoding="utf-8")
          assert (p/"intercession-prayers.js").is_file()
          assert (p/"index.html").read_text(encoding="utf-8").count("intercession-prayers.js")>=1
          print("PREVISUALISATION SEPAREE: /preview-intercessions/ ; intentions isolees")
          PY
      - name: Finaliser la version publique 5.10.0 avec les prières d'intercession
        run: |
          cp /tmp/totus-preview-src/site/intercession-prayers.js site/intercession-prayers.js
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path("site")
          html=(p/"index.html").read_text(encoding="utf-8")
          assert "intercession-prayers.js" not in html, "Inclusion double"
          html=html.replace("</body>",'<script src="./intercession-prayers.js?v=5.10.0" defer></script></body>',1)
          assert html.count("intercession-prayers.js")==1
          (p/"index.html").write_text(html,encoding="utf-8")
          sw=p/"service-worker.js"
          worker=sw.read_text(encoding="utf-8")
          worker,n=re.subn(r"const CACHE=['\"][^'\"]+['\"]","const CACHE='totus-tuus-pages-v5-10-0'",worker,count=1)
          assert n==1,"Cache SW introuvable"
          assert "const ASSETS=[" in worker
          worker=worker.replace("const ASSETS=[","const ASSETS=['./intercession-prayers.js?v=5.10.0',",1)
          sw.write_text(worker,encoding="utf-8")
          version=p/"version.json"
          version.write_text(json.dumps({"version":"5.10.0-pages","release":"5.10.0"},ensure_ascii=False),encoding="utf-8")
          # Conserver la clé de stockage existante pour les intentions et progressions.
          source=(p/"interventions.js").read_text(encoding="utf-8")
          assert "totus-intercession-v51" in source
          assert "intercession-prayers.js?v=5.10.0" in html
          print("RELEASE 5.10.0 : 108 prières ; stockage existant préservé ; cache renouvelé")
          PY
      - name: Vérifier les fichiers et la syntaxe JavaScript
        run: |
          python3 scripts/check_site.py site
          for file in site/*.js; do node --check "$file"; done
          NODE_PATH=/tmp/totus-qa/node_modules node --version
      - name: Activer GitHub Pages avec GitHub Actions si autorisé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || echo "Configuration Pages existante ou activation à effectuer dans Settings > Pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
