name: Vérifier la prévisualisation isolée du parcours marial 33 jours
on:
  push:
    branches:
      - candidate/parcours-marial-33-jours
    paths:
      - 'modules/parcours-marial/**'
      - 'scripts/build_traite_33_lectures.py'
      - 'scripts/build_bible_crampon_33.py'
      - '.github/workflows/preview-parcours-marial.yml'
      - 'scripts/import_public_site.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider les 33 passages bibliques Crampon (sans publication)
        run: python3 scripts/build_bible_crampon_33.py
      - name: Importer une copie du site historique (lecture seule)
        run: python3 scripts/import_public_site.py
      - name: Récupérer les 108 prières de la version 5.10.0
        run: |
          git clone --quiet --depth 1 --branch candidate/intercessions-108 "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/totus-510-src
          cd /tmp/totus-510-src
          cp "$GITHUB_WORKSPACE/scripts/import_public_site.py" scripts/import_public_site.py
          python3 scripts/import_public_site.py
          test -s site/intercession-prayers.js
          cd "$GITHUB_WORKSPACE"
          cp /tmp/totus-510-src/site/intercession-prayers.js site/intercession-prayers.js
      - name: Ajouter le module candidat sans toucher aux scripts historiques
        run: |
          mkdir -p site/modules/parcours-marial
          cp modules/parcours-marial/*.js modules/parcours-marial/*.json site/modules/parcours-marial/
          python3 scripts/build_traite_33_lectures.py site/modules/parcours-marial/traite_33_lectures.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('site')
          data=json.loads((p/'modules/parcours-marial/parcours_marial_33_jours_enrichi.json').read_text())
          assert len(data['jours'])==33
          assert [j['jour'] for j in data['jours']]==list(range(1,34))
          assert all(j.get('priere_du_jour') and j.get('explication_spirituelle') and j.get('lecture_biblique') for j in data['jours'])
          html=p/'index.html'
          content=html.read_text(encoding='utf-8')
          tag='<script src="./modules/parcours-marial/parcours-marial.js?v=candidate-33" defer></script>'
          prayers_tag='<script src="./intercession-prayers.js?v=5.10.0" defer></script>'
          assert 'intercession-prayers.js' not in content
          assert tag not in content
          assert '</body>' in content
          html.write_text(content.replace('</body>',prayers_tag+tag+'</body>',1),encoding='utf-8')
          # Isoler le cache de prévisualisation de la version publique.
          sw=p/'service-worker.js'
          worker=sw.read_text(encoding='utf-8')
          worker=worker.replace('totus-tuus-pages-v5-9-1','totus-tuus-parcours-marial-candidate-33')
          assert "const ASSETS=[" in worker
          worker=worker.replace("const ASSETS=[","const ASSETS=['./intercession-prayers.js?v=5.10.0','./modules/parcours-marial/parcours-marial.js?v=candidate-33','./modules/parcours-marial/parcours_marial_33_jours_enrichi.json','./modules/parcours-marial/traite_33_lectures.json',",1)
          assert 'totus-intercession-v51' in (p/'interventions.js').read_text(encoding='utf-8')
          # Ne supprimer que les anciens caches de CE candidat, jamais ceux de V5.10.0.
          worker=worker.replace("key.startsWith('totus-tuus-')&&key!==CACHE","key.startsWith('totus-tuus-parcours-marial-candidate-')&&key!==CACHE")
          # En cas de JSON absent, ne pas renvoyer le HTML comme faux JSON.
          worker=worker.replace("caches.match(req).then(res=>res||caches.match('./index.html'))","caches.match(req).then(res=>res||(req.mode==='navigate'?caches.match('./index.html'):Response.error()))")
          assert "key.startsWith('totus-tuus-parcours-marial-candidate-')" in worker
          sw.write_text(worker,encoding='utf-8')
          (p/'version.json').write_text(json.dumps({'version':'candidate-parcours-marial-33','release':'preview-only'}),encoding='utf-8')
          print('33 journées + 108 prières V5.10.0 intégrées à une copie autonome du site')
          PY
      - name: Contrôles de la copie et du JavaScript
        run: |
          python3 scripts/check_site.py site
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site')
          html=(p/'index.html').read_text(encoding='utf-8')
          assert html.count('intercession-prayers.js')==1
          assert html.count('parcours-marial.js')==1
          assert (p/'intercession-prayers.js').stat().st_size>1000
          assert (p/'modules/parcours-marial/parcours_marial_33_jours_enrichi.json').is_file()
          assert 'totus-intercession-v51' in (p/'interventions.js').read_text(encoding='utf-8')
          print('V5.10.0: intercessions présentes, parcours 33 jours présent, stockage existant conservé')
          PY
          for file in site/*.js site/modules/parcours-marial/*.js; do node --check "$file"; done
      - name: Livrer uniquement un artefact de test, sans publication
        uses: actions/upload-artifact@v4
        with:
          name: totus-tuus-parcours-marial-33-preview
          path: site/
          include-hidden-files: true
          retention-days: 14
