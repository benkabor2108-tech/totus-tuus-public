name: Préparer la version candidate GitHub Pages
on:
  push:
    branches: [main, 'candidate/intercessions-108']
    paths:
      - 'scripts/**'
      - 'overrides/**'
      - '.github/workflows/prepare-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les fichiers du site Netlify existant sans le modifier
        run: python3 scripts/import_public_site.py
      - name: Contrôler la version candidate
        run: |
          python3 scripts/check_site.py site
          for file in site/*.js; do node --check "$file"; done
      - name: Examiner le service worker et les chemins du site
        run: |
          head -c 3000 site/service-worker.js
          echo
          grep -o 'src="[^"]*"' site/index.html || true
          grep -o 'href="[^"]*"' site/index.html || true
      - name: Installer le lecteur PDF de contrôle
        run: python3 -m pip install pypdf
      - name: Vérifier les neuf commentaires, le livret PDF et le cache
        run: python3 scripts/qa_stabilisation.py
      - name: Vérifier les 108 prières spécifiques de la version candidate
        run: python3 scripts/qa_intercessions_108.py
      - name: Auditer les chemins PWA GitHub Pages
        run: python3 scripts/qa_pwa_paths.py
      - name: Archiver la version candidate sans la publier
        uses: actions/upload-artifact@v4
        with:
          name: totus-tuus-pages-candidat
          path: site/
          include-hidden-files: true
          retention-days: 7
